# Railway configuration for Reputation Manager
# ⚠️  Railway monorepos require per-service config in the dashboard
# This file serves as documentation. See docs/RAILWAY_DEPLOY.md for full guide.
#
# Project Structure (5 services):
#   PostgreSQL (managed)  → DATABASE_URL
#   Redis (managed)       → REDIS_URL
#   api                   → Dockerfile: apps/api/Dockerfile
#   worker                → Dockerfile: apps/worker/Dockerfile
#   web                   → Dockerfile: apps/web/Dockerfile
#
# All Dockerfiles use repo root as build context (Root Directory: /)
#
# === API Service Variables ===
# DATABASE_URL=${{Postgres.DATABASE_URL}}
# REDIS_URL=${{Redis.REDIS_URL}}
# NODE_ENV=production
# BETTER_AUTH_SECRET=<openssl rand -base64 32>
# BETTER_AUTH_URL=https://<api-domain>
# FRONTEND_URL=https://<web-domain>
# CORS_ORIGINS=https://<web-domain>
# TWILIO_ACCOUNT_SID=
# TWILIO_AUTH_TOKEN=
# TWILIO_PHONE_NUMBER=
# STRIPE_SECRET_KEY=
# STRIPE_WEBHOOK_SECRET=
# STRIPE_STARTER_PRICE_ID=
# STRIPE_PROFESSIONAL_PRICE_ID=
# RESEND_API_KEY=
# GOOGLE_PLACES_API_KEY=
# SENTRY_DSN=
#
# === Worker Service Variables ===
# DATABASE_URL=${{Postgres.DATABASE_URL}}
# REDIS_URL=${{Redis.REDIS_URL}}
# NODE_ENV=production
# TWILIO_ACCOUNT_SID=
# TWILIO_AUTH_TOKEN=
# TWILIO_PHONE_NUMBER=
# SENTRY_DSN=
#
# === Web Service Variables ===
# NODE_ENV=production
# NEXT_PUBLIC_API_URL=https://<api-domain>
# NEXT_PUBLIC_SENTRY_DSN=
# NEXT_PUBLIC_BETA_MODE=true
