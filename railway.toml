# Railway configuration for Reputation Manager (monorepo)
#
# Each service uses its own railway.toml.
# In the Railway dashboard, set each service's "Config Path" to the
# corresponding file below. Root Directory should be "/" for all services
# so the Dockerfiles can access the full monorepo.
#
#   API service    → Config Path: apps/api/railway.toml
#   Worker service → Config Path: apps/worker/railway.toml
#
# See docs/DEPLOYMENT.md for the full setup guide.
